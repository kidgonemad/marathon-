# Builds the site and publishes it to GitHub Pages at https://<owner>.github.io/<repo>/
# Only needed if Pages is switched to Source: "GitHub Actions". With the current "Deploy from a branch"
# setting the site is served from live/ instead (tools/build_live.py). Run manually from the Actions tab.
name: Deploy site to GitHub Pages (Actions mode)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Marathon Burger site
        run: |
          python3 -I tools/apply.py
          python3 -I tools/rebase.py dist "/${{ github.event.repository.name }}/"
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
