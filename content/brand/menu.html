<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu · {{NAME}}</title>
<meta name="description" content="The full {{NAME}} menu: burgers, $20 combos, hot wings, Marathon classics, breakfast, shakes and drinks.">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="stylesheet" href="/vendor/poppins.css">
<link rel="stylesheet" href="/brand/logo.css">
<script src="/brand/logo-data.js"></script>
<script src="/brand/logo.js"></script>
<style>
@font-face { font-family: "Futura Passata"; font-weight: 700; font-display: swap; src: url(/fonts/passata.woff2) format("woff2"); }
:root { --red: #eb3322; --yellow: #ffc737; --cream: #f7f2e5; --ink: #000; --purple: #7721c7; --blue: #2097cf; --green: #8df947; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--yellow); color: var(--ink); font-family: Poppins, system-ui, sans-serif; font-weight: 500; overflow-x: hidden; }
a { color: inherit; }
.shadow-text { text-shadow: 0 .06em 0 #000; -webkit-text-stroke: 0.035em #000; paint-order: stroke fill; color: var(--cream); }

header { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 10px clamp(16px, 4vw, 48px); background: var(--yellow); border-bottom: 3px solid #000; }
header nav { display: flex; gap: clamp(12px, 3vw, 40px); font-weight: 700; font-size: clamp(14px, 1.4vw, 18px); }
header nav a { text-decoration: none; }
header nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
header nav.end { justify-content: flex-end; }
.logo-link { display: block; width: clamp(150px, 20vw, 260px); }
.logo-link .the-preloader__logo { position: relative; width: 100%; }

.hero { text-align: center; padding: clamp(40px, 8vw, 90px) 16px clamp(24px, 4vw, 40px); position: relative; }
.hero h1 { font-family: "Futura Passata", Poppins, sans-serif; font-size: clamp(64px, 13vw, 180px); line-height: .9; }
.hero p { margin-top: 18px; font-size: clamp(15px, 1.6vw, 20px); }
.jump { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
.chip { font-weight: 700; text-decoration: none; background: var(--cream); border: 3px solid #000; border-radius: 12px;
  box-shadow: 4px 4px 0 #000; padding: 8px 14px; transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s; }
.chip:hover { transform: translate(-2px, -3px) rotate(-2deg); box-shadow: 6px 7px 0 #000; }

main { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 80px; columns: 2 520px; column-gap: 32px; }
section { break-inside: avoid; background: var(--cream); border: 3px solid #000; border-radius: 24px; box-shadow: 8px 8px 0 #000;
  padding: clamp(20px, 3vw, 32px); margin: 0 0 32px; scroll-margin-top: 120px; }
section:nth-child(3n+2) { background: #fff; }
section h2 { font-family: "Futura Passata", Poppins, sans-serif; font-size: clamp(36px, 4.2vw, 56px); line-height: .95; color: var(--red);
  -webkit-text-stroke: 0; }
section .note { margin-top: 8px; font-size: 14px; }
ul { list-style: none; padding: 0; margin-top: 18px; display: grid; gap: 16px; }
li { border-top: 2px dashed #0003; padding-top: 14px; }
li:first-child { border-top: 0; padding-top: 0; }
.row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.name { font-weight: 700; font-size: clamp(16px, 1.5vw, 19px); }
.price { font-family: "Futura Passata", Poppins, sans-serif; font-size: 24px; color: #000; white-space: nowrap;
  background: var(--yellow); border: 2.5px solid #000; border-radius: 10px; padding: 0 8px; box-shadow: 3px 3px 0 #000; }
.desc { margin-top: 6px; font-size: 14px; line-height: 1.45; font-weight: 400; }
.veg { display: inline-block; font-size: 11px; font-weight: 700; background: var(--green); border: 2px solid #000; border-radius: 99px;
  padding: 0 7px; margin-left: 8px; vertical-align: middle; }
.foot { text-align: center; padding: 40px 16px 60px; font-size: 13px; }
.foot .studio { display: block; margin: 0 auto 22px; width: 200px; height: auto; filter: brightness(0); opacity: .85; }
.foot strong { display: block; font-family: "Futura Passata", Poppins, sans-serif; font-size: 28px; margin-bottom: 10px; }
.palm { position: absolute; width: 64px; height: 71px; pointer-events: none; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(4deg); } }
@media (max-width: 700px) {
  header { grid-template-columns: 1fr auto; }
  header nav.start { display: none; }
  main { columns: 1; }
}
@media (prefers-reduced-motion: reduce) { .palm { animation: none; } }
</style>
</head>
<body>
<header>
  <nav class="start"><a href="/#how">How it works</a><a href="/#locations">Locations</a></nav>
  <a class="logo-link" href="/" aria-label="{{NAME}} home"><div class="the-preloader__logo" id="logo"></div></a>
  <nav class="end"><a href="/">Home</a><a href="mailto:{{EMAIL}}">Contact</a></nav>
</header>
<div class="hero">
  {{PALMS}}
  <h1 class="shadow-text">MeNu</h1>
  <p>Double wagyu smash burgers, hot wings, Marathon classics and breakfast.</p>
  <div class="jump">{{CHIPS}}</div>
</div>
<main>
{{SECTIONS}}
</main>
<div class="foot"><img class="studio" src="/brand/studio-logo.svg" alt="33rd Creative" width="200"><strong>ThE MaRaThoN CoNtiNuEs.</strong>{{FOOTNOTE}}</div>
<script>
  const logo = window.MarathonLogo.mount(document.getElementById('logo'));
  logo.volume = 0;
  setTimeout(() => { logo.loadInput.value = true; }, 250);
</script>
</body>
</html>
